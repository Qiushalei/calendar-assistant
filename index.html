<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>🐶 玉桂狗日历</title>
  <style>
    /* ===== 基础 & 字体 ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", Arial, sans-serif;
      background: #fff0f5;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ===== 顶部标题栏 ===== */
    .app-header {
      background: linear-gradient(135deg, #ffb7c5 0%, #ffd6e0 100%);
      padding: 12px 16px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(255,150,170,0.25);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .app-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .app-title .mascot { font-size: 28px; line-height: 1; }

    .app-title h1 {
      font-size: 18px;
      font-weight: 700;
      color: #c0436a;
      letter-spacing: 1px;
    }

    #syncBar {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #d47a90;
    }
    #syncBar .sdot {
      width: 7px; height: 7px; border-radius: 50%; background: #ddd; flex-shrink: 0;
    }
    #syncBar.syncing .sdot { background: #ffaa00; animation: pulse 1s infinite; }
    #syncBar.ok .sdot { background: #6dcc6d; }
    #syncBar.error .sdot { background: #ff6b6b; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* ===== 月份导航 ===== */
    .month-nav {
      background: #ffe0ea;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
    }

    .month-nav button {
      background: #ffb7c5;
      border: none;
      border-radius: 50%;
      width: 32px; height: 32px;
      font-size: 18px;
      color: #c0436a;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
      box-shadow: 0 2px 4px rgba(192,67,106,0.2);
    }
    .month-nav button:active { background: #ff96b0; transform: scale(0.95); }

    .month-title {
      font-size: 17px;
      font-weight: 700;
      color: #c0436a;
      letter-spacing: 1px;
    }

    /* ===== 星期行 ===== */
    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: #ffd6e0;
      padding: 4px 0;
    }
    .weekdays span {
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: #c0436a;
      padding: 3px 0;
    }
    .weekdays span:first-child,
    .weekdays span:last-child { color: #e8608a; }

    /* ===== 日期网格 ===== */
    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1px;
      background: #ffc0d0;
      flex: 1;
    }

    .day-cell {
      background: #fff8fb;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      cursor: pointer;
      transition: background 0.15s;
      overflow: hidden;
      position: relative;
    }

    .day-cell:active { background: #ffe8f0; }
    .day-cell.empty { background: #fff0f5; cursor: default; }

    /* 日期数字区 */
    .day-num-wrap {
      display: flex;
      justify-content: center;
      padding: 4px 2px 2px;
    }

    .day-num {
      font-size: 13px;
      font-weight: 600;
      color: #555;
      width: 24px; height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* 今天 */
    .day-cell.today .day-num {
      background: #ffb7c5;
      color: #c0436a;
      font-weight: 800;
    }

    /* 颜色等级（背景色条） */
    .day-cell.level-1 { background: #f0fdf0; }
    .day-cell.level-2 { background: #fffbf0; }
    .day-cell.level-3,
    .day-cell.level-4,
    .day-cell.level-5 { background: #fff5f5; }

    /* 日期数字随等级变色 */
    .day-cell.level-1 .day-num { color: #389e0d; }
    .day-cell.level-2 .day-num { color: #d46b08; }
    .day-cell.level-3 .day-num,
    .day-cell.level-4 .day-num,
    .day-cell.level-5 .day-num { color: #cf1322; }

    /* 今天 + 等级 */
    .day-cell.today.level-1 .day-num { background: #b7eb8f; color: #135200; }
    .day-cell.today.level-2 .day-num { background: #ffe58f; color: #874d00; }
    .day-cell.today.level-3 .day-num,
    .day-cell.today.level-4 .day-num,
    .day-cell.today.level-5 .day-num { background: #ffadb7; color: #820014; }

    /* 选中框 */
    .day-cell.selected {
      outline: 2px solid #ff7eb3;
      outline-offset: -2px;
      z-index: 1;
    }

    /* 日期内事件文字 */
    .cell-events {
      padding: 1px 3px 3px;
      display: flex;
      flex-direction: column;
      gap: 1px;
      overflow: hidden;
    }

    .cell-event-tag {
      font-size: 9px;
      line-height: 1.3;
      padding: 1px 3px;
      border-radius: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #fff;
      font-weight: 500;
    }

    .day-cell.level-1 .cell-event-tag { background: #73d13d; }
    .day-cell.level-2 .cell-event-tag { background: #ffa940; }
    .day-cell.level-3 .cell-event-tag,
    .day-cell.level-4 .cell-event-tag,
    .day-cell.level-5 .cell-event-tag { background: #ff7875; }

    .cell-more {
      font-size: 9px;
      color: #aaa;
      text-align: center;
      padding-bottom: 1px;
    }

    /* ===== 事件详情面板 ===== */
    .event-panel {
      background: #fff8fb;
      border-top: 2px solid #ffd6e0;
      padding: 14px 16px 80px; /* 底部留出设置按钮空间 */
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .panel-title {
      font-size: 14px;
      font-weight: 700;
      color: #c0436a;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .date-badge {
      font-size: 11px;
      background: #ffb7c5;
      color: #c0436a;
      padding: 2px 10px;
      border-radius: 20px;
      font-weight: 600;
    }

    /* 色标说明 */
    .legend {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 10px;
      color: #c08090;
    }
    .ldot {
      width: 8px; height: 8px; border-radius: 50%;
    }
    .ldot-g { background: #73d13d; }
    .ldot-y { background: #ffa940; }
    .ldot-r { background: #ff7875; }

    /* 事件列表 */
    .event-list { list-style: none; margin-bottom: 12px; }

    .event-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      border-radius: 12px;
      background: #fff;
      margin-bottom: 6px;
      border: 1.5px solid #ffd6e0;
      box-shadow: 0 1px 4px rgba(255,150,170,0.1);
    }

    .event-index {
      font-size: 11px;
      color: #ffb7c5;
      font-weight: 700;
      min-width: 16px;
    }

    .event-text {
      flex: 1;
      font-size: 14px;
      color: #444;
      word-break: break-all;
      line-height: 1.4;
    }
    .event-text.editing { display: none; }

    .event-edit-input {
      flex: 1;
      font-size: 14px;
      border: 1.5px solid #ffb7c5;
      border-radius: 8px;
      padding: 3px 8px;
      outline: none;
      display: none;
      font-family: inherit;
      color: #444;
    }
    .event-edit-input.editing { display: block; }

    .btn-icon {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      padding: 2px 4px;
      border-radius: 6px;
      transition: background 0.15s;
      line-height: 1;
    }
    .btn-icon:active { background: #ffe0ea; }

    .no-events {
      text-align: center;
      color: #ffb7c5;
      font-size: 13px;
      padding: 16px 0 8px;
    }

    /* 添加事件 */
    .add-event-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .add-event-row input {
      flex: 1;
      border: 2px solid #ffd6e0;
      border-radius: 24px;
      padding: 10px 16px;
      font-size: 14px;
      outline: none;
      background: #fff;
      font-family: inherit;
      color: #444;
      transition: border-color 0.2s;
    }
    .add-event-row input::placeholder { color: #ffb7c5; }
    .add-event-row input:focus { border-color: #ff7eb3; }

    .add-event-row button {
      background: linear-gradient(135deg, #ff96b0, #ffb7c5);
      color: #fff;
      border: none;
      border-radius: 24px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      font-family: inherit;
      box-shadow: 0 2px 8px rgba(255,110,160,0.3);
    }
    .add-event-row button:active { transform: scale(0.96); }
    .add-event-row button:disabled {
      background: #ffd6e0;
      box-shadow: none;
      cursor: not-allowed;
    }

    .limit-tip {
      font-size: 11px;
      color: #ff7eb3;
      margin-top: 6px;
      text-align: center;
      display: none;
    }
    .limit-tip.visible { display: block; }

    /* ===== 悬浮设置按钮 ===== */
    #settingsBtn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 44px; height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffb7c5, #ffd6e0);
      border: none;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 3px 12px rgba(255,110,160,0.35);
      display: flex; align-items: center; justify-content: center;
      z-index: 20;
      transition: transform 0.2s;
    }
    #settingsBtn:active { transform: scale(0.92); }

    /* ===== 配置弹窗 ===== */
    #configOverlay {
      position: fixed; inset: 0;
      background: rgba(255,192,208,0.5);
      backdrop-filter: blur(4px);
      display: flex; align-items: flex-end; justify-content: center;
      z-index: 100;
    }

    #configBox {
      background: #fff8fb;
      border-radius: 24px 24px 0 0;
      padding: 24px 20px 36px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 -4px 24px rgba(255,110,160,0.2);
      animation: slideUp 0.25s ease;
    }
    @keyframes slideUp { from { transform: translateY(60px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    #configBox .drag-handle {
      width: 40px; height: 4px;
      background: #ffd6e0;
      border-radius: 2px;
      margin: 0 auto 18px;
    }

    #configBox h2 {
      font-size: 17px; font-weight: 700;
      color: #c0436a; margin-bottom: 6px;
      display: flex; align-items: center; gap: 6px;
    }

    #configBox p {
      font-size: 13px; color: #c08090;
      margin-bottom: 16px; line-height: 1.6;
    }

    #configBox label {
      font-size: 12px; color: #c0436a;
      font-weight: 600; display: block;
      margin-bottom: 4px; margin-top: 10px;
    }

    #configBox input {
      width: 100%;
      border: 2px solid #ffd6e0;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 13px;
      outline: none;
      font-family: monospace;
      color: #444;
      background: #fff;
      transition: border-color 0.2s;
    }
    #configBox input:focus { border-color: #ff7eb3; }

    #configBox .btn-row {
      display: flex; gap: 10px;
      margin-top: 18px;
    }

    #configBox button {
      flex: 1; border: none; border-radius: 24px;
      padding: 12px; font-size: 14px; font-weight: 700;
      cursor: pointer; font-family: inherit;
      transition: transform 0.15s;
    }
    #configBox button:active { transform: scale(0.97); }

    #configBox .btn-primary {
      background: linear-gradient(135deg, #ff96b0, #ffb7c5);
      color: #fff;
      box-shadow: 0 2px 8px rgba(255,110,160,0.3);
    }
    #configBox .btn-secondary {
      background: #ffe0ea; color: #c0436a;
    }
  </style>
</head>
<body>

<!-- 配置弹窗 -->
<div id="configOverlay">
  <div id="configBox">
    <div class="drag-handle"></div>
    <h2>☁️ 云同步设置</h2>
    <p>输入 GitHub Token 和 Gist ID，所有设备自动同步数据。Token 只保存在本设备浏览器中。</p>
    <label>GitHub Token（需要 gist 权限）</label>
    <input type="password" id="cfgToken" placeholder="gho_..." autocomplete="off" />
    <label>Gist ID</label>
    <input type="text" id="cfgGistId" placeholder="4d6a1cf954bb3525554b5d7ea4bb5e49" />
    <div class="btn-row">
      <button type="button" class="btn-secondary" id="cfgSkip">仅本地使用</button>
      <button type="button" class="btn-primary" id="cfgSave">保存并同步 🐾</button>
    </div>
  </div>
</div>

<!-- 顶部标题 -->
<div class="app-header">
  <div class="app-title">
    <span class="mascot">🐶</span>
    <h1>玉桂狗日历</h1>
  </div>
  <div id="syncBar"><div class="sdot"></div><span id="syncText">未同步</span></div>
</div>

<!-- 月份导航 -->
<div class="month-nav">
  <button type="button" id="prevMonth" title="上个月">‹</button>
  <span class="month-title" id="monthTitle"></span>
  <button type="button" id="nextMonth" title="下个月">›</button>
</div>

<!-- 星期行 -->
<div class="weekdays">
  <span>日</span><span>一</span><span>二</span><span>三</span>
  <span>四</span><span>五</span><span>六</span>
</div>

<!-- 日期网格 -->
<div class="days-grid" id="daysGrid"></div>

<!-- 事件详情面板 -->
<div class="event-panel">
  <div class="panel-header">
    <div class="panel-title">
      🐾 <span id="dateBadge" class="date-badge"></span>
    </div>
    <div class="legend">
      <div class="legend-item"><div class="ldot ldot-g"></div>1条</div>
      <div class="legend-item"><div class="ldot ldot-y"></div>2条</div>
      <div class="legend-item"><div class="ldot ldot-r"></div>3+条</div>
    </div>
  </div>

  <ul class="event-list" id="eventList"></ul>

  <div class="add-event-row">
    <input type="text" id="newEventInput" placeholder="记点什么呀～" maxlength="100" />
    <button type="button" id="addEventBtn">添加</button>
  </div>
  <div class="limit-tip" id="limitTip">🐶 最多登记 5 条哦～</div>
</div>

<!-- 悬浮设置按钮 -->
<button type="button" id="settingsBtn" title="云同步设置">⚙️</button>

<script>
  const CFG_TOKEN_KEY = 'cal_gist_token';
  const CFG_GIST_KEY  = 'cal_gist_id';
  const STORAGE_KEY   = 'calendar_events_v1';
  const GIST_FILE     = 'calendar_data.json';

  function getCfg() {
    return {
      token:  localStorage.getItem(CFG_TOKEN_KEY) || '',
      gistId: localStorage.getItem(CFG_GIST_KEY)  || ''
    };
  }

  // ===== 配置弹窗 =====
  const overlay   = document.getElementById('configOverlay');
  const cfgToken  = document.getElementById('cfgToken');
  const cfgGistId = document.getElementById('cfgGistId');

  function openConfig() {
    const c = getCfg();
    cfgToken.value  = c.token;
    cfgGistId.value = c.gistId;
    overlay.style.display = 'flex';
  }
  function closeConfig() { overlay.style.display = 'none'; }

  document.getElementById('cfgSave').addEventListener('click', () => {
    const t = cfgToken.value.trim();
    const g = cfgGistId.value.trim();
    if (!t || !g) { alert('请填写 Token 和 Gist ID'); return; }
    localStorage.setItem(CFG_TOKEN_KEY, t);
    localStorage.setItem(CFG_GIST_KEY,  g);
    closeConfig();
    fetchFromGist().then(remote => {
      if (remote) { data = remote; renderCalendar(); renderEvents(); }
    });
  });
  document.getElementById('cfgSkip').addEventListener('click', closeConfig);
  document.getElementById('settingsBtn').addEventListener('click', openConfig);

  const cfg = getCfg();
  if (!cfg.token || !cfg.gistId) {
    cfgGistId.value = '4d6a1cf954bb3525554b5d7ea4bb5e49';
  } else {
    closeConfig();
  }

  // ===== 同步状态 =====
  const syncBar  = document.getElementById('syncBar');
  const syncText = document.getElementById('syncText');
  function setSyncStatus(state, msg) {
    syncBar.className = state;
    syncText.textContent = msg;
  }

  // ===== Gist API =====
  async function fetchFromGist() {
    const { token, gistId } = getCfg();
    if (!token || !gistId) { setSyncStatus('', '未同步'); return null; }
    setSyncStatus('syncing', '同步中…');
    try {
      const res = await fetch(`https://api.github.com/gists/${gistId}`, {
        headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github+json' }
      });
      if (!res.ok) throw new Error(res.status);
      const gist   = await res.json();
      const raw    = gist.files[GIST_FILE]?.content || '{}';
      const remote = JSON.parse(raw);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(remote));
      setSyncStatus('ok', '已同步 ✓');
      return remote;
    } catch {
      setSyncStatus('error', '同步失败');
      return null;
    }
  }

  let pushTimer = null;
  function pushToGist(dataObj) {
    const { token, gistId } = getCfg();
    if (!token || !gistId) return;
    clearTimeout(pushTimer);
    setSyncStatus('syncing', '保存中…');
    pushTimer = setTimeout(async () => {
      try {
        const res = await fetch(`https://api.github.com/gists/${gistId}`, {
          method: 'PATCH',
          headers: {
            Authorization: `token ${token}`,
            Accept: 'application/vnd.github+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ files: { [GIST_FILE]: { content: JSON.stringify(dataObj) } } })
        });
        if (!res.ok) throw new Error(res.status);
        setSyncStatus('ok', '已保存 ✓');
      } catch {
        setSyncStatus('error', '保存失败');
      }
    }, 600);
  }

  // ===== 本地存储 =====
  function loadLocal() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch { return {}; }
  }
  function saveData(dataObj) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(dataObj));
    pushToGist(dataObj);
  }

  function dateKey(year, month, day) {
    return `${year}-${String(month + 1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  }

  // ===== 状态 =====
  const today = new Date();
  let curYear  = today.getFullYear();
  let curMonth = today.getMonth();
  let selectedDate = dateKey(today.getFullYear(), today.getMonth(), today.getDate());
  let data = loadLocal();

  // ===== 日历渲染 =====
  function renderCalendar() {
    document.getElementById('monthTitle').textContent = `${curYear} 年 ${curMonth + 1} 月`;
    const grid = document.getElementById('daysGrid');
    grid.innerHTML = '';

    const firstDay    = new Date(curYear, curMonth, 1).getDay();
    const daysInMonth = new Date(curYear, curMonth + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
      const empty = document.createElement('div');
      empty.className = 'day-cell empty';
      grid.appendChild(empty);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const key    = dateKey(curYear, curMonth, d);
      const events = data[key] || [];
      const count  = events.length;

      const cell = document.createElement('div');
      cell.className = 'day-cell';

      if (curYear === today.getFullYear() && curMonth === today.getMonth() && d === today.getDate())
        cell.classList.add('today');

      if      (count === 1) cell.classList.add('level-1');
      else if (count === 2) cell.classList.add('level-2');
      else if (count >= 3)  cell.classList.add('level-3');

      if (key === selectedDate) cell.classList.add('selected');

      // 日期数字
      const numWrap = document.createElement('div');
      numWrap.className = 'day-num-wrap';
      const numEl = document.createElement('div');
      numEl.className = 'day-num';
      numEl.textContent = d;
      numWrap.appendChild(numEl);
      cell.appendChild(numWrap);

      // 格内事件文字（最多显示3条，多余显示 +N）
      if (count > 0) {
        const tagsWrap = document.createElement('div');
        tagsWrap.className = 'cell-events';
        const showMax = 3;
        events.slice(0, showMax).forEach(text => {
          const tag = document.createElement('div');
          tag.className = 'cell-event-tag';
          tag.textContent = text;
          tagsWrap.appendChild(tag);
        });
        if (count > showMax) {
          const more = document.createElement('div');
          more.className = 'cell-more';
          more.textContent = `+${count - showMax}`;
          tagsWrap.appendChild(more);
        }
        cell.appendChild(tagsWrap);
      }

      cell.addEventListener('click', () => {
        selectedDate = key;
        renderCalendar();
        renderEvents();
        document.querySelector('.event-panel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });

      grid.appendChild(cell);
    }
  }

  // ===== 事件面板 =====
  function renderEvents() {
    const events   = data[selectedDate] || [];
    const list     = document.getElementById('eventList');
    const badge    = document.getElementById('dateBadge');
    const addBtn   = document.getElementById('addEventBtn');
    const limitTip = document.getElementById('limitTip');

    const [y, m, d] = selectedDate.split('-');
    badge.textContent = `${y}年${parseInt(m)}月${parseInt(d)}日`;
    list.innerHTML = '';

    if (events.length === 0) {
      const empty = document.createElement('li');
      empty.className = 'no-events';
      empty.textContent = '🐶 今天还没有事件，记点什么吧～';
      list.appendChild(empty);
    } else {
      events.forEach((text, idx) => list.appendChild(createEventItem(text, idx)));
    }

    const isFull = events.length >= 5;
    addBtn.disabled = isFull;
    limitTip.classList.toggle('visible', isFull);
  }

  function createEventItem(text, idx) {
    const li = document.createElement('li');
    li.className = 'event-item';

    const idxSpan = document.createElement('span');
    idxSpan.className = 'event-index';
    idxSpan.textContent = `${idx + 1}.`;

    const textSpan = document.createElement('span');
    textSpan.className = 'event-text';
    textSpan.textContent = text;

    const editInput = document.createElement('input');
    editInput.className = 'event-edit-input';
    editInput.type = 'text';
    editInput.value = text;
    editInput.maxLength = 100;

    const editBtn = document.createElement('button');
    editBtn.className = 'btn-icon';
    editBtn.type = 'button';
    editBtn.title = '编辑';
    editBtn.textContent = '✏️';

    const saveBtn = document.createElement('button');
    saveBtn.className = 'btn-icon';
    saveBtn.type = 'button';
    saveBtn.title = '保存';
    saveBtn.textContent = '✅';
    saveBtn.style.display = 'none';

    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn-icon';
    cancelBtn.type = 'button';
    cancelBtn.title = '取消';
    cancelBtn.textContent = '❌';
    cancelBtn.style.display = 'none';

    const delBtn = document.createElement('button');
    delBtn.className = 'btn-icon';
    delBtn.type = 'button';
    delBtn.title = '删除';
    delBtn.textContent = '🗑️';

    editBtn.addEventListener('click', () => {
      textSpan.classList.add('editing');
      editInput.classList.add('editing');
      editBtn.style.display = 'none';
      delBtn.style.display = 'none';
      saveBtn.style.display = '';
      cancelBtn.style.display = '';
      editInput.focus();
      editInput.select();
    });

    const doSave = () => {
      const newVal = editInput.value.trim();
      if (!newVal) { alert('事件内容不能为空哦'); return; }
      if (!data[selectedDate]) data[selectedDate] = [];
      data[selectedDate][idx] = newVal;
      saveData(data);
      renderCalendar();
      renderEvents();
    };

    saveBtn.addEventListener('click', doSave);
    editInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') doSave();
      if (e.key === 'Escape') cancelBtn.click();
    });

    cancelBtn.addEventListener('click', () => {
      textSpan.classList.remove('editing');
      editInput.classList.remove('editing');
      editInput.value = text;
      editBtn.style.display = '';
      delBtn.style.display = '';
      saveBtn.style.display = 'none';
      cancelBtn.style.display = 'none';
    });

    delBtn.addEventListener('click', () => {
      if (!data[selectedDate]) return;
      data[selectedDate].splice(idx, 1);
      if (data[selectedDate].length === 0) delete data[selectedDate];
      saveData(data);
      renderCalendar();
      renderEvents();
    });

    li.appendChild(idxSpan);
    li.appendChild(textSpan);
    li.appendChild(editInput);
    li.appendChild(editBtn);
    li.appendChild(saveBtn);
    li.appendChild(cancelBtn);
    li.appendChild(delBtn);
    return li;
  }

  // ===== 添加事件 =====
  function addEvent() {
    const input = document.getElementById('newEventInput');
    const text  = input.value.trim();
    if (!text) return;
    if (!data[selectedDate]) data[selectedDate] = [];
    if (data[selectedDate].length >= 5) return;
    data[selectedDate].push(text);
    saveData(data);
    input.value = '';
    renderCalendar();
    renderEvents();
    input.focus();
  }

  document.getElementById('addEventBtn').addEventListener('click', addEvent);
  document.getElementById('newEventInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') addEvent();
  });

  // ===== 月份切换 =====
  document.getElementById('prevMonth').addEventListener('click', () => {
    if (--curMonth < 0) { curMonth = 11; curYear--; }
    renderCalendar();
  });
  document.getElementById('nextMonth').addEventListener('click', () => {
    if (++curMonth > 11) { curMonth = 0; curYear++; }
    renderCalendar();
  });

  // ===== 初始化 =====
  renderCalendar();
  renderEvents();

  if (cfg.token && cfg.gistId) {
    fetchFromGist().then(remote => {
      if (remote) { data = remote; renderCalendar(); renderEvents(); }
    });
  }
</script>
</body>
</html>
