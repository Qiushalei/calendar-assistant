<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日历助手</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    h1 { font-size: 22px; color: #333; margin-bottom: 20px; letter-spacing: 2px; }

    /* 同步状态栏 */
    #syncBar {
      width: 100%; max-width: 480px;
      font-size: 12px; color: #888; text-align: right;
      margin-bottom: 6px; height: 18px;
      display: flex; align-items: center; justify-content: flex-end; gap: 6px;
    }
    #syncBar .sdot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; }
    #syncBar.syncing .sdot { background: #faad14; animation: pulse 1s infinite; }
    #syncBar.ok .sdot { background: #52c41a; }
    #syncBar.error .sdot { background: #ff4d4f; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    /* 配置弹窗 */
    #configOverlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45);
      display: flex; align-items: center; justify-content: center; z-index: 100;
    }
    #configBox {
      background: #fff; border-radius: 14px; padding: 28px 24px;
      width: 90%; max-width: 420px; box-shadow: 0 4px 24px rgba(0,0,0,0.18);
    }
    #configBox h2 { font-size: 17px; margin-bottom: 8px; color: #222; }
    #configBox p { font-size: 13px; color: #666; margin-bottom: 16px; line-height: 1.6; }
    #configBox label { font-size: 13px; color: #444; display: block; margin-bottom: 4px; }
    #configBox input {
      width: 100%; border: 1px solid #d9d9d9; border-radius: 8px;
      padding: 8px 10px; font-size: 13px; outline: none; margin-bottom: 12px;
      font-family: monospace;
    }
    #configBox input:focus { border-color: #4a90d9; }
    #configBox .btn-row { display: flex; gap: 8px; justify-content: flex-end; }
    #configBox button {
      border: none; border-radius: 8px; padding: 8px 18px;
      font-size: 14px; cursor: pointer; font-family: inherit;
    }
    #configBox .btn-primary { background: #4a90d9; color: #fff; }
    #configBox .btn-primary:hover { background: #3578c7; }
    #configBox .btn-secondary { background: #f0f2f5; color: #555; }
    #configBox .btn-secondary:hover { background: #e0e3ea; }
    #configBox .setup-hint {
      font-size: 12px; color: #999; margin-top: 10px; line-height: 1.6;
    }
    #configBox .setup-hint a { color: #4a90d9; }

    /* 日历容器 */
    .calendar-wrapper {
      background: #fff; border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      width: 100%; max-width: 480px; overflow: hidden;
    }
    .calendar-header {
      display: flex; align-items: center; justify-content: space-between;
      background: #4a90d9; color: #fff; padding: 14px 20px;
    }
    .calendar-header button {
      background: none; border: none; color: #fff; font-size: 20px;
      cursor: pointer; width: 32px; height: 32px; border-radius: 50%;
      transition: background 0.2s; display: flex; align-items: center; justify-content: center;
    }
    .calendar-header button:hover { background: rgba(255,255,255,0.2); }
    .month-title { font-size: 18px; font-weight: 600; }

    .weekdays {
      display: grid; grid-template-columns: repeat(7, 1fr);
      background: #e8f0fb; text-align: center; padding: 6px 0;
    }
    .weekdays span { font-size: 12px; color: #666; font-weight: 600; }

    .days-grid {
      display: grid; grid-template-columns: repeat(7, 1fr);
      gap: 1px; background: #e5e5e5; border-top: 1px solid #e5e5e5;
    }
    .day-cell {
      background: #fff; min-height: 52px; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; transition: background 0.15s; position: relative;
    }
    .day-cell:hover { background: #f5f8ff; }
    .day-cell.empty { background: #fafafa; cursor: default; }
    .day-cell .day-num {
      font-size: 14px; font-weight: 500; color: #333;
      width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; transition: all 0.2s;
    }
    .day-cell.today .day-num { border: 2px solid #4a90d9; color: #4a90d9; }
    .day-cell.level-1 .day-num { background: #52c41a; color: #fff; }
    .day-cell.level-2 .day-num { background: #faad14; color: #fff; }
    .day-cell.level-3 .day-num,
    .day-cell.level-4 .day-num,
    .day-cell.level-5 .day-num { background: #ff4d4f; color: #fff; }
    .day-cell.today.level-1 .day-num { border-color: #52c41a; }
    .day-cell.today.level-2 .day-num { border-color: #faad14; }
    .day-cell.today.level-3 .day-num,
    .day-cell.today.level-4 .day-num,
    .day-cell.today.level-5 .day-num { border-color: #ff4d4f; }
    .day-cell.selected .day-num { outline: 3px solid #4a90d9; outline-offset: 2px; }

    .dot-row { display: flex; gap: 2px; margin-top: 2px; height: 5px; }
    .dot { width: 4px; height: 4px; border-radius: 50%; background: #bbb; }

    /* 事件面板 */
    .event-panel {
      background: #fff; border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      width: 100%; max-width: 480px; margin-top: 16px; padding: 20px;
    }
    .event-panel-title {
      font-size: 15px; font-weight: 600; color: #333;
      margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
    }
    .event-panel-title .date-badge {
      font-size: 12px; background: #4a90d9; color: #fff;
      padding: 2px 10px; border-radius: 20px; font-weight: 400;
    }
    .event-list { list-style: none; margin-bottom: 12px; }
    .event-item {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; border-radius: 8px; background: #f7f8fa;
      margin-bottom: 6px; transition: background 0.15s;
    }
    .event-item:hover { background: #eef2fb; }
    .event-index { font-size: 11px; color: #999; min-width: 18px; }
    .event-text { flex: 1; font-size: 14px; color: #333; word-break: break-all; }
    .event-text.editing { display: none; }
    .event-edit-input {
      flex: 1; font-size: 14px; border: 1px solid #4a90d9;
      border-radius: 6px; padding: 2px 8px; outline: none; display: none;
    }
    .event-edit-input.editing { display: block; }
    .btn-icon {
      background: none; border: none; cursor: pointer; font-size: 15px;
      padding: 2px 5px; border-radius: 4px; transition: background 0.15s; color: #666;
    }
    .btn-icon:hover { background: #dde5f7; color: #333; }
    .btn-icon.save { color: #52c41a; }
    .btn-icon.cancel { color: #ff4d4f; }

    .add-event-row { display: flex; gap: 8px; }
    .add-event-row input {
      flex: 1; border: 1px solid #d9d9d9; border-radius: 8px;
      padding: 8px 12px; font-size: 14px; outline: none;
      transition: border-color 0.2s; font-family: inherit;
    }
    .add-event-row input:focus { border-color: #4a90d9; }
    .add-event-row button {
      background: #4a90d9; color: #fff; border: none; border-radius: 8px;
      padding: 8px 16px; font-size: 14px; cursor: pointer;
      transition: background 0.2s; font-family: inherit;
    }
    .add-event-row button:hover { background: #3578c7; }
    .add-event-row button:disabled { background: #b0c9ea; cursor: not-allowed; }

    .limit-tip { font-size: 12px; color: #ff4d4f; margin-top: 6px; display: none; }
    .limit-tip.visible { display: block; }
    .no-events { text-align: center; color: #bbb; font-size: 13px; padding: 12px 0; }

    /* 设置按钮 */
    #settingsBtn {
      position: fixed; bottom: 20px; right: 20px;
      width: 40px; height: 40px; border-radius: 50%;
      background: #fff; border: 1px solid #ddd;
      font-size: 18px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      display: flex; align-items: center; justify-content: center;
    }
    #settingsBtn:hover { background: #f0f2f5; }

    .legend {
      display: flex; gap: 16px; justify-content: center;
      margin-top: 16px; flex-wrap: wrap;
    }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #555; }
    .legend-dot { width: 14px; height: 14px; border-radius: 50%; }
    .legend-dot-green  { background: #52c41a; }
    .legend-dot-yellow { background: #faad14; }
    .legend-dot-red    { background: #ff4d4f; }
  </style>
</head>
<body>

<!-- 配置弹窗 -->
<div id="configOverlay">
  <div id="configBox">
    <h2>☁️ 云同步设置</h2>
    <p>输入你的 GitHub Token 和 Gist ID，即可在所有设备上同步日历数据。<br>Token 只存在本设备浏览器中，不会上传到任何地方。</p>
    <label>GitHub Token（需要 gist 权限）</label>
    <input type="password" id="cfgToken" placeholder="gho_..." autocomplete="off" />
    <label>Gist ID</label>
    <input type="text" id="cfgGistId" placeholder="4d6a1cf954bb3525554b5d7ea4bb5e49" />
    <div class="btn-row">
      <button type="button" class="btn-secondary" id="cfgSkip">暂不同步，仅本地使用</button>
      <button type="button" class="btn-primary" id="cfgSave">保存并同步</button>
    </div>
    <div class="setup-hint">
      Token 和 Gist ID 只需在每台新设备上输入一次，之后自动同步。
    </div>
  </div>
</div>

<h1>📅 日历助手</h1>
<div id="syncBar"><div class="sdot"></div><span id="syncText">未配置同步</span></div>

<div class="calendar-wrapper">
  <div class="calendar-header">
    <button id="prevMonth" title="上个月">&#8249;</button>
    <span class="month-title" id="monthTitle"></span>
    <button id="nextMonth" title="下个月">&#8250;</button>
  </div>
  <div class="weekdays">
    <span>日</span><span>一</span><span>二</span><span>三</span>
    <span>四</span><span>五</span><span>六</span>
  </div>
  <div class="days-grid" id="daysGrid"></div>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot legend-dot-green"></div>1 条事件</div>
  <div class="legend-item"><div class="legend-dot legend-dot-yellow"></div>2 条事件</div>
  <div class="legend-item"><div class="legend-dot legend-dot-red"></div>3-5 条事件</div>
</div>

<div class="event-panel">
  <div class="event-panel-title">
    当日事件
    <span class="date-badge" id="dateBadge"></span>
  </div>
  <ul class="event-list" id="eventList"></ul>
  <div class="add-event-row">
    <input type="text" id="newEventInput" placeholder="输入事件内容…" maxlength="100" />
    <button type="button" id="addEventBtn">添加</button>
  </div>
  <div class="limit-tip" id="limitTip">最多登记 5 条事件</div>
</div>

<button id="settingsBtn" title="云同步设置">⚙️</button>

<script>
  // ===== 配置 =====
  const CFG_TOKEN_KEY  = 'cal_gist_token';
  const CFG_GIST_KEY   = 'cal_gist_id';
  const STORAGE_KEY    = 'calendar_events_v1';
  const GIST_FILE      = 'calendar_data.json';

  function getCfg() {
    return {
      token:  localStorage.getItem(CFG_TOKEN_KEY) || '',
      gistId: localStorage.getItem(CFG_GIST_KEY) || ''
    };
  }

  // ===== 配置弹窗 =====
  const overlay = document.getElementById('configOverlay');
  const cfgToken  = document.getElementById('cfgToken');
  const cfgGistId = document.getElementById('cfgGistId');

  function openConfig() {
    const cfg = getCfg();
    cfgToken.value  = cfg.token;
    cfgGistId.value = cfg.gistId;
    overlay.style.display = 'flex';
  }

  function closeConfig() {
    overlay.style.display = 'none';
  }

  document.getElementById('cfgSave').addEventListener('click', () => {
    const t = cfgToken.value.trim();
    const g = cfgGistId.value.trim();
    if (!t || !g) { alert('请填写 Token 和 Gist ID'); return; }
    localStorage.setItem(CFG_TOKEN_KEY, t);
    localStorage.setItem(CFG_GIST_KEY, g);
    closeConfig();
    fetchFromGist().then(remote => {
      if (remote) { data = remote; renderCalendar(); renderEvents(); }
    });
  });

  document.getElementById('cfgSkip').addEventListener('click', closeConfig);
  document.getElementById('settingsBtn').addEventListener('click', openConfig);

  // 首次使用（没有配置）自动弹出
  const cfg = getCfg();
  if (!cfg.token || !cfg.gistId) {
    // 预填 Gist ID
    cfgGistId.value = '4d6a1cf954bb3525554b5d7ea4bb5e49';
  } else {
    closeConfig();
  }

  // ===== 同步状态 =====
  const syncBar  = document.getElementById('syncBar');
  const syncText = document.getElementById('syncText');
  function setSyncStatus(state, msg) {
    syncBar.className = state;
    syncText.textContent = msg;
  }

  // ===== Gist API =====
  async function fetchFromGist() {
    const { token, gistId } = getCfg();
    if (!token || !gistId) { setSyncStatus('', '未配置同步'); return null; }
    setSyncStatus('syncing', '正在同步数据…');
    try {
      const res = await fetch(`https://api.github.com/gists/${gistId}`, {
        headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github+json' }
      });
      if (!res.ok) throw new Error(res.status);
      const gist = await res.json();
      const raw  = gist.files[GIST_FILE]?.content || '{}';
      const remote = JSON.parse(raw);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(remote));
      setSyncStatus('ok', '数据已同步 ✓');
      return remote;
    } catch (e) {
      setSyncStatus('error', '同步失败，使用本地数据');
      return null;
    }
  }

  let pushTimer = null;
  function pushToGist(dataObj) {
    const { token, gistId } = getCfg();
    if (!token || !gistId) return;
    clearTimeout(pushTimer);
    setSyncStatus('syncing', '正在保存…');
    pushTimer = setTimeout(async () => {
      try {
        const res = await fetch(`https://api.github.com/gists/${gistId}`, {
          method: 'PATCH',
          headers: {
            Authorization: `token ${token}`,
            Accept: 'application/vnd.github+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ files: { [GIST_FILE]: { content: JSON.stringify(dataObj) } } })
        });
        if (!res.ok) throw new Error(res.status);
        setSyncStatus('ok', '已保存到云端 ✓');
      } catch (e) {
        setSyncStatus('error', '云端保存失败，数据仅在本地');
      }
    }, 600);
  }

  // ===== 本地存储 =====
  function loadLocal() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch { return {}; }
  }
  function saveData(dataObj) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(dataObj));
    pushToGist(dataObj);
  }

  function dateKey(year, month, day) {
    return `${year}-${String(month + 1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  }

  // ===== 状态 =====
  const today = new Date();
  let curYear  = today.getFullYear();
  let curMonth = today.getMonth();
  let selectedDate = dateKey(today.getFullYear(), today.getMonth(), today.getDate());
  let data = loadLocal();

  // ===== 日历渲染 =====
  function renderCalendar() {
    document.getElementById('monthTitle').textContent = `${curYear} 年 ${curMonth + 1} 月`;
    const grid = document.getElementById('daysGrid');
    grid.innerHTML = '';

    const firstDay    = new Date(curYear, curMonth, 1).getDay();
    const daysInMonth = new Date(curYear, curMonth + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
      const empty = document.createElement('div');
      empty.className = 'day-cell empty';
      grid.appendChild(empty);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const key    = dateKey(curYear, curMonth, d);
      const events = data[key] || [];
      const count  = events.length;

      const cell = document.createElement('div');
      cell.className = 'day-cell';

      if (curYear === today.getFullYear() && curMonth === today.getMonth() && d === today.getDate())
        cell.classList.add('today');

      if      (count === 1) cell.classList.add('level-1');
      else if (count === 2) cell.classList.add('level-2');
      else if (count >= 3)  cell.classList.add('level-3');

      if (key === selectedDate) cell.classList.add('selected');

      const numEl = document.createElement('div');
      numEl.className = 'day-num';
      numEl.textContent = d;
      cell.appendChild(numEl);

      if (count > 0) {
        const dots = document.createElement('div');
        dots.className = 'dot-row';
        for (let i = 0; i < Math.min(count, 5); i++) {
          const dot = document.createElement('div');
          dot.className = 'dot';
          dots.appendChild(dot);
        }
        cell.appendChild(dots);
      }

      cell.addEventListener('click', () => {
        selectedDate = key;
        renderCalendar();
        renderEvents();
      });
      grid.appendChild(cell);
    }
  }

  // ===== 事件面板 =====
  function renderEvents() {
    const events   = data[selectedDate] || [];
    const list     = document.getElementById('eventList');
    const badge    = document.getElementById('dateBadge');
    const addBtn   = document.getElementById('addEventBtn');
    const limitTip = document.getElementById('limitTip');

    const [y, m, d] = selectedDate.split('-');
    badge.textContent = `${y}年${parseInt(m)}月${parseInt(d)}日`;
    list.innerHTML = '';

    if (events.length === 0) {
      const empty = document.createElement('li');
      empty.className = 'no-events';
      empty.textContent = '暂无事件，点击添加';
      list.appendChild(empty);
    } else {
      events.forEach((text, idx) => list.appendChild(createEventItem(text, idx)));
    }

    const isFull = events.length >= 5;
    addBtn.disabled = isFull;
    limitTip.classList.toggle('visible', isFull);
  }

  function createEventItem(text, idx) {
    const li = document.createElement('li');
    li.className = 'event-item';

    const idxSpan = document.createElement('span');
    idxSpan.className = 'event-index';
    idxSpan.textContent = `${idx + 1}.`;

    const textSpan = document.createElement('span');
    textSpan.className = 'event-text';
    textSpan.textContent = text;

    const editInput = document.createElement('input');
    editInput.className = 'event-edit-input';
    editInput.type = 'text';
    editInput.value = text;
    editInput.maxLength = 100;

    const editBtn = document.createElement('button');
    editBtn.className = 'btn-icon edit';
    editBtn.title = '编辑';
    editBtn.textContent = '✏️';

    const saveBtn = document.createElement('button');
    saveBtn.className = 'btn-icon save';
    saveBtn.title = '保存';
    saveBtn.textContent = '✔';
    saveBtn.style.display = 'none';

    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn-icon cancel';
    cancelBtn.title = '取消';
    cancelBtn.textContent = '✖';
    cancelBtn.style.display = 'none';

    const delBtn = document.createElement('button');
    delBtn.className = 'btn-icon delete';
    delBtn.title = '删除';
    delBtn.textContent = '🗑️';

    editBtn.addEventListener('click', () => {
      textSpan.classList.add('editing');
      editInput.classList.add('editing');
      editBtn.style.display = 'none';
      delBtn.style.display = 'none';
      saveBtn.style.display = '';
      cancelBtn.style.display = '';
      editInput.focus();
      editInput.select();
    });

    const doSave = () => {
      const newVal = editInput.value.trim();
      if (!newVal) { alert('事件内容不能为空'); return; }
      if (!data[selectedDate]) data[selectedDate] = [];
      data[selectedDate][idx] = newVal;
      saveData(data);
      renderCalendar();
      renderEvents();
    };

    saveBtn.addEventListener('click', doSave);
    editInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') doSave();
      if (e.key === 'Escape') cancelBtn.click();
    });

    cancelBtn.addEventListener('click', () => {
      textSpan.classList.remove('editing');
      editInput.classList.remove('editing');
      editInput.value = text;
      editBtn.style.display = '';
      delBtn.style.display = '';
      saveBtn.style.display = 'none';
      cancelBtn.style.display = 'none';
    });

    delBtn.addEventListener('click', () => {
      if (!data[selectedDate]) return;
      data[selectedDate].splice(idx, 1);
      if (data[selectedDate].length === 0) delete data[selectedDate];
      saveData(data);
      renderCalendar();
      renderEvents();
    });

    li.appendChild(idxSpan);
    li.appendChild(textSpan);
    li.appendChild(editInput);
    li.appendChild(editBtn);
    li.appendChild(saveBtn);
    li.appendChild(cancelBtn);
    li.appendChild(delBtn);
    return li;
  }

  // ===== 添加事件 =====
  function addEvent() {
    const input = document.getElementById('newEventInput');
    const text  = input.value.trim();
    if (!text) return;
    if (!data[selectedDate]) data[selectedDate] = [];
    if (data[selectedDate].length >= 5) return;
    data[selectedDate].push(text);
    saveData(data);
    input.value = '';
    renderCalendar();
    renderEvents();
    input.focus();
  }

  document.getElementById('addEventBtn').addEventListener('click', addEvent);
  document.getElementById('newEventInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') addEvent();
  });

  // ===== 月份切换 =====
  document.getElementById('prevMonth').addEventListener('click', () => {
    if (--curMonth < 0) { curMonth = 11; curYear--; }
    renderCalendar();
  });
  document.getElementById('nextMonth').addEventListener('click', () => {
    if (++curMonth > 11) { curMonth = 0; curYear++; }
    renderCalendar();
  });

  // ===== 初始化 =====
  renderCalendar();
  renderEvents();

  // 已配置则自动同步
  if (cfg.token && cfg.gistId) {
    fetchFromGist().then(remote => {
      if (remote) { data = remote; renderCalendar(); renderEvents(); }
    });
  }
</script>
</body>
</html>
